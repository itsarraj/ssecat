[package]
name = "ssecat"
version = "0.1.0"
edition = "2021"
description = "Server-Sent Events (SSE) streaming inspector, JSON harvester, and LLM token latency benchmark"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/ssecat"
readme = "README.md"
keywords = ["sse", "server-sent-events", "streaming", "llm", "benchmark"]
categories = ["command-line-utilities", "development-tools", "network-programming"]

[lib]
name = "ssecat"
path = "src/lib.rs"

[[bin]]
name = "ssecat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
